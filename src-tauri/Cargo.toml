[package]
name = "synapse"
version = "0.1.0"
description = "Synapse - offline voice dictation with Whisper and local LLM cleanup"
authors = ["Gustavo Puhlmann"]
edition = "2021"
default-run = "synapse"

[lib]
name = "synapse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.18.1"
enigo = "0.6.1"
arboard = "3.6.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
whisper-rs = { version = "0.16.0", features = ["tracing_backend", "raw-api"] }
ort = { version = "2.0.0-rc.12", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_Globalization"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-autostart = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[features]
default = ["vad"]
cuda = ["whisper-rs/cuda"]
vad = ["dep:ort"]
metal = ["whisper-rs/metal"]
